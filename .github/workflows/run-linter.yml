name: Run Linter

on:
  push:
    branches: [ pre-release, release ]
  pull_request:
    branches: [ pre-release, release ]

jobs:
  lint-javascript:
    name: Lint JavaScript Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Lint codebase
        run: npm run lint