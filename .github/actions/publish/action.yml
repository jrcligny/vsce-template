name: 'Publish'

description: 'Publish package'

runs:
  using: "composite"

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '20'

    - name: Setup Environment
      shell: bash
      run: node -e "console.log('PACKAGE_VERSION=' + require('./package.json').version)" >> $GITHUB_ENV

    - name: Verify versions
      shell: bash
      run: node -e "if ('refs/tags/v' + '${{ env.PACKAGE_VERSION }}' !== '${{ github.ref }}') { console.log('::error' + 'Version Mismatch. refs/tags/v' + '${{ env.PACKAGE_VERSION }}', '${{ github.ref }}'); throw Error('Version Mismatch')} "

    - name: Install Dependencies
      shell: bash
      run: npm install

    - name: Package Extension
      shell: bash
      run: npm run package

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: '*.vsix'
